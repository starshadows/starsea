<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090b25">
  <meta name="description" content="在梦幻星云与流星之下，漫游一片映照星空的斑斓湖面。拖动环顾，触碰水面。">
  <title>星海之间 · Starsea</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23090b25'/%3E%3Cpath d='M32 8 37 25 54 30 37 35 32 52 27 35 10 30 27 25Z' fill='%23c3a4ff'/%3E%3Cpath d='M12 51Q32 44 52 51' fill='none' stroke='%238de7ee' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css?v=5">
</head>
<body>
  <main id="experience" aria-label="星云与湖面的三维交互场景">
    <canvas id="scene" tabindex="0" aria-label="星海。拖动或使用方向键进行360度自由旋转，点击湖面产生涟漪。Home键回到初始视角。"></canvas>
    <div class="edge-shade" aria-hidden="true"></div>
    <header class="chrome topbar">
      <div class="brand"><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="m16 2 2.9 10.1L29 15l-10.1 2.9L16 28l-2.9-10.1L3 15l10.1-2.9L16 2Z" stroke="currentColor"/><path d="M5 28c7-3 15-3 22 0" stroke="currentColor" opacity=".5"/></svg><span>STARSEA</span></div>
      <div class="top-actions">
        <label class="quality"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m12 3 9 5-9 5-9-5 9-5ZM3 12l9 5 9-5M3 16l9 5 9-5" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg><select id="quality" aria-label="场景画质"><option value="high" selected>高清画质</option><option value="ultra">超清画质</option><option value="auto">自动画质</option><option value="low">流畅画质</option></select></label>
        <button id="music-toggle" class="icon-button music-button" data-music-toggle aria-label="播放配乐《星海未眠》" aria-pressed="false" title="配乐 · 星海未眠"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 10h4l5-4v12l-5-4H4v-4Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path class="music-waves" d="M16 9a5 5 0 0 1 0 6m3-9a9 9 0 0 1 0 12" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path class="music-slash" d="m16 10 5 5m0-5-5 5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button>
        <button id="reset-view" class="icon-button" aria-label="回到初始视角" title="回到初始视角（Home）"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.2"/><path d="m15 8-2 6-4 2 2-6 4-2Z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg></button>
        <button id="pause" class="icon-button" aria-label="暂停动画" title="暂停动画"><svg id="pause-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 6v12M15 6v12" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>
        <button id="immerse" class="icon-button" aria-label="进入沉浸模式" title="沉浸模式"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
    </header>
    <p id="music-status" class="chrome music-status" role="status" hidden></p>
    <footer class="chrome bottom-bar">
      <div class="scene-title"><span class="eyebrow">THE SHORE OF INFINITY</span><h1>星海之间<span class="title-dot">.</span></h1><p>让这一刻，再慢一点。</p></div>
      <div class="interaction-hint" id="hint"><span class="hint-mark" aria-hidden="true">↔</span><span class="desktop-hint">拖动环顾 · 滚轮缩放 · 点击湖面</span><span class="mobile-hint">滑动环顾 · 双指缩放 · 轻触水面</span></div>
      <div class="zoom-controls" role="group" aria-label="场景缩放">
        <button id="zoom-out" aria-label="缩小" title="缩小（−）">−</button>
        <button id="zoom-reset" aria-label="恢复1倍缩放" title="恢复1倍缩放">1.0×</button>
        <button id="zoom-in" aria-label="放大" title="放大（+）">+</button>
      </div>
      <button id="meteor" class="meteor-button"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m5 3 10 10M3 8l7 7M10 2l7 7" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/><path d="m17 12 1.3 3.7L22 17l-3.7 1.3L17 22l-1.3-3.7L12 17l3.7-1.3L17 12Z" stroke="currentColor" stroke-linejoin="round"/></svg><span>唤起流星</span></button>
    </footer>
    <button id="leave-immersive" aria-label="退出沉浸模式">退出沉浸 <span>↗</span></button>
    <button id="music-immersive" class="icon-button music-button" data-music-toggle aria-label="播放配乐《星海未眠》" aria-pressed="false" title="配乐 · 星海未眠"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 10h4l5-4v12l-5-4H4v-4Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path class="music-waves" d="M16 9a5 5 0 0 1 0 6m3-9a9 9 0 0 1 0 12" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path class="music-slash" d="m16 10 5 5m0-5-5 5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button>
    <audio id="background-music" src="/audio/starsea-awake.mp3?v=1" loop preload="none" aria-hidden="true"></audio>
    <div id="toast" role="status" aria-live="polite"></div>
    <div id="loading" role="status"><div class="loading-star">✦</div><span>正在抵达星海</span></div>
    <div id="unsupported" hidden><span>✦</span><h1>星海还未亮起</h1><p id="error-message">请使用支持 WebGL 2 的浏览器，并开启硬件加速后重新打开。</p><button onclick="location.reload()">重新进入</button></div>
    <noscript><div class="no-script">请开启 JavaScript，进入星海。</div></noscript>
  </main>
  <script type="module" src="/scene.js?v=7"></script>
  <script type="module" src="/music.js?v=1"></script>
</body>
</html>
